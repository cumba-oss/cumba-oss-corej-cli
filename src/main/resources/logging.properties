# Fix #58 — CLI logging configuration. Loaded by CdiscValidate.main(...) at startup via
# LogManager.readConfiguration(...) so users see a clean "LEVEL: message" format on stderr
# without configuring JUL themselves.

.level = INFO
handlers = java.util.logging.ConsoleHandler

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$-7s] %2$s %5$s%6$s%n

# Quiet a couple of chatty third-party loggers — adjust if a CLI consumer wants verbose
# detail for HTTP debugging.
sun.net.www.protocol.http.HttpURLConnection.level = WARNING
